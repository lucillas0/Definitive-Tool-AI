name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-skills.cjs
      - run: node --check scripts/remind-design.cjs && node --check scripts/qa-gate.cjs && node --check scripts/log-usage.cjs && node --check scripts/validate-skills.cjs
